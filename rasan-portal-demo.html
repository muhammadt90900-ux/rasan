<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0033A1">
<title>ڕاسان — پۆرتاڵی فرۆشگاکان (دیمۆ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0033A1;--blue2:#2152c9;--sky:#eaf0ff;--cream:#f7f5f0;--ink:#14213d;--muted:#667089;--line:#e3e7ef;--ok:#11795a;--okbg:#e2f5ed;--warn:#a85607;--warnbg:#fff2df;--bad:#b42318;--badbg:#fdecea;--card:#fff;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream)}
body{font-family:'Noto Sans Arabic',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.demo-bar{background:#111827;color:#fde68a;font-size:12px;text-align:center;padding:6px 14px;line-height:1.5}
.wrap{max-width:540px;margin:0 auto;min-height:100vh;position:relative}

/* login */
#login{padding:28px 18px 40px}
.hero{background:linear-gradient(160deg,var(--blue),#0a1f63);color:#fff;border-radius:26px;padding:26px 20px 24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.logo{width:48px;height:48px;border-radius:14px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.hero h1{font-size:22px;line-height:1.4;margin:16px 0 8px}
.hero p{opacity:.85;font-size:14px}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:-14px;position:relative;z-index:1;margin-inline:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fbfcfe;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;font-weight:700;background:var(--blue);color:#fff}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--sky);color:var(--blue)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:11px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.langs{display:inline-flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.langs button{padding:4px 11px;border-radius:999px;font-size:12px;color:#fff;font-weight:700}
.langs button.on{background:#fff;color:var(--blue)}
.langs.dark{background:var(--sky)}
.langs.dark button{color:var(--blue)}
.langs.dark button.on{background:var(--blue);color:#fff}

/* app */
#app{display:none;padding-bottom:92px}
header.top{background:var(--blue);color:#fff;padding:14px 16px 20px;border-radius:0 0 24px 24px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:40px;height:40px;font-size:19px;border-radius:12px}
.brand b{display:block;font-size:16px;line-height:1.3}
.brand small{opacity:.8;font-size:12px;display:block}
.who{margin-top:14px;font-size:13px;opacity:.92;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
main{padding:16px}
.view{display:none;animation:fade .2s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:19px;margin:4px 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
h3{font-size:15px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.blue{background:var(--blue);color:#fff;border:0}
.card.blue .muted{color:rgba(255,255,255,.8)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{font-size:24px;font-weight:800;line-height:1.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}
.p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}
.p-blue{background:var(--sky);color:var(--blue)}
.bar{height:8px;background:var(--sky);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.card.blue .bar{background:rgba(255,255,255,.2)}
.card.blue .bar i{background:#fff}
.action{display:flex;align-items:center;gap:12px;text-align:start;width:100%}
.action .ic{width:44px;height:44px;border-radius:13px;background:var(--sky);color:var(--blue);display:grid;place-items:center;flex:none}
.action b{display:block;font-size:15px}
.chev{margin-inline-start:auto;color:var(--muted)}
[dir=rtl] .chev{transform:scaleX(-1)}

/* products */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 40px 12px 14px;background:#fff;outline:none}
[dir=ltr] .search input{padding:12px 14px 12px 40px}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.prod{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.tile{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none}
.prod .info{flex:1;min-width:0}
.prod b{display:block;font-size:14.5px;line-height:1.4}
.prod .price{font-weight:800;color:var(--blue);font-size:14px;margin-top:2px}
.step{display:flex;align-items:center;gap:2px;background:var(--sky);border-radius:12px;padding:3px;flex:none}
.step button{width:32px;height:32px;border-radius:10px;font-size:19px;font-weight:700;color:var(--blue);display:grid;place-items:center}
.step button:active{background:#d6e1ff}
.step span{min-width:26px;text-align:center;font-weight:800}
.addbtn{background:var(--blue);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;flex:none}

/* cart */
.line-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line-item:last-child{border-bottom:0}
.line-item .info{flex:1;min-width:0}
.line-item b{font-size:14px;display:block;line-height:1.4}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:6px}
.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:#fff}
.day b{display:block}
.day.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0;display:none}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.sum.t{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}

/* toggle */
.tog{width:50px;height:30px;border-radius:99px;background:#cfd6e4;position:relative;flex:none;transition:.2s}
.tog:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--ok)}
.tog.on:after{inset-inline-start:23px}

/* orders */
.order{padding:12px 0;border-bottom:1px solid var(--line)}
.order:last-child{border-bottom:0}

/* factory */
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi .big{font-size:20px;color:var(--blue)}
.hbar{margin-bottom:10px}
.hbar .row{font-size:13px}
.area{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.area:last-child{border-bottom:0}
.area .n{margin-inline-start:auto;font-weight:700}
.fbanner{background:#0b1b4d}

/* nav */
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bottom button.on{color:var(--blue)}
nav.bottom svg{width:23px;height:23px}
.badge{position:absolute;top:4px;inset-inline-end:calc(50% - 22px);background:var(--bad);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:99px;display:none;place-items:center;padding:0 4px;font-weight:800}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,20,50,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:24px;padding:24px 20px;width:100%;max-width:500px;text-align:center;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .ok{width:64px;height:64px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px;font-size:32px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="demo-bar" data-t="demoBar"></div>
<div class="wrap">

<!-- LOGIN -->
<section id="login">
  <div class="hero">
    <div class="row">
      <div class="logo">ڕ</div>
      <div class="langs" data-langs></div>
    </div>
    <h1 data-t="loginTitle"></h1>
    <p data-t="loginSub"></p>
  </div>
  <div class="form">
    <div class="field"><label data-t="phone"></label><input type="tel" value="0770 123 4567" inputmode="tel"></div>
    <div class="field"><label data-t="code"></label><input value="HLB-0217"></div>
    <button class="btn" onclick="loginShop()" data-t="loginBtn"></button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="loginFactory()" data-t="loginFactory"></button>
    <p class="note" data-t="loginNote"></p>
  </div>
</section>

<!-- APP -->
<section id="app">
  <header class="top" id="topbar">
    <div class="top-row">
      <div class="brand"><div class="logo">ڕ</div><div><b data-t="brand"></b><small id="brandSub"></small></div></div>
      <div class="langs" data-langs></div>
    </div>
    <div class="who"><span class="dot"></span><span id="whoName"></span></div>
  </header>

  <main>
    <!-- HOME -->
    <div class="view" id="v-home">
      <h2 data-t="hello"></h2>
      <p class="sub" data-t="helloSub"></p>
      <div id="weekStatus"></div>
      <div class="card">
        <div class="row"><div><div class="muted" data-t="nextDelivery"></div><div class="big" id="nextDay"></div></div><span class="pill p-blue" data-t="areaName"></span></div>
        <p class="muted" style="margin-top:6px" data-t="deliveryDays"></p>
        <p class="muted" data-t="cutoff"></p>
      </div>
      <div class="card">
        <button class="action" onclick="loadWeekly()">
          <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
          <span><b data-t="quickWeekly"></b><span class="muted" data-t="quickWeeklySub"></span></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="card">
        <button class="action" onclick="go('products')">
          <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span><b data-t="browse"></b><span class="muted" data-t="browseSub"></span></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="card blue" id="balCard"></div>
    </div>

    <!-- PRODUCTS -->
    <div class="view" id="v-products">
      <h2 data-t="products"></h2>
      <p class="sub" data-t="productsSub"></p>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" oninput="renderProducts()" data-tp="search">
      </div>
      <div class="chips" id="cats"></div>
      <div id="plist"></div>
    </div>

    <!-- CART -->
    <div class="view" id="v-cart">
      <h2 data-t="cartTitle"></h2>
      <p class="sub" data-t="cartSub"></p>
      <div class="card" id="cartItems"></div>
      <div id="cartRest">
        <div class="card">
          <h3 data-t="deliveryDay"></h3>
          <div class="days" id="days"></div>
          <div class="field" style="margin:14px 0 0"><label data-t="notes"></label><textarea id="notes" rows="2" data-tp="notesPh"></textarea></div>
        </div>
        <div class="card">
          <div class="sum"><span data-t="itemsCount"></span><b id="sCount"></b></div>
          <div class="sum"><span data-t="cartonsCount"></span><b id="sCartons"></b></div>
          <div class="sum t"><span data-t="total"></span><span id="sTotal"></span></div>
          <div class="warnbox" id="limitWarn" data-t="limitWarn"></div>
          <div style="height:12px"></div>
          <button class="btn" onclick="submitOrder()" data-t="submit"></button>
          <div style="height:8px"></div>
          <button class="btn line" onclick="saveWeekly()" data-t="saveWeekly"></button>
        </div>
      </div>
    </div>

    <!-- WEEKLY -->
    <div class="view" id="v-weekly">
      <h2 data-t="weeklyTitle"></h2>
      <p class="sub" data-t="weeklySub"></p>
      <div class="card">
        <div class="row">
          <div><b data-t="autoRepeat"></b><p class="muted" data-t="autoRepeatSub"></p></div>
          <button class="tog" id="autoTog" onclick="toggleAuto()" aria-label="auto"></button>
        </div>
        <p class="pill p-ok" id="autoInfo" style="margin-top:10px;display:none" data-t="autoInfo"></p>
      </div>
      <div class="card" id="weeklyItems"></div>
      <button class="btn" onclick="loadWeekly()" data-t="loadWeekly"></button>
    </div>

    <!-- ACCOUNT -->
    <div class="view" id="v-account">
      <h2 data-t="accountTitle"></h2>
      <p class="sub" data-t="accountSub"></p>
      <div class="card blue" id="balCard2"></div>
      <div class="grid2" style="margin-bottom:12px">
        <div class="kpi"><div class="muted" data-t="lastPayment"></div><div class="big" style="font-size:16px" id="lastPay"></div></div>
        <div class="kpi"><div class="muted" data-t="ordersMonth"></div><div class="big" style="font-size:16px" id="ordMonth"></div></div>
      </div>
      <div class="card"><h3 data-t="orders"></h3><div id="orderList"></div></div>
      <button class="btn ghost" onclick="loginFactory()" data-t="factoryBtn"></button>
      <div style="height:8px"></div>
      <button class="btn line" onclick="logout()" data-t="logout"></button>
    </div>

    <!-- FACTORY -->
    <div class="view" id="v-factory">
      <h2 data-t="factoryTitle"></h2>
      <p class="sub" data-t="factorySub"></p>
      <div class="grid2" style="margin-bottom:12px" id="kpis"></div>
      <div class="card"><h3 data-t="needProduce"></h3><div id="produce"></div></div>
      <div class="card"><h3 data-t="byArea"></h3><div id="areas"></div></div>
      <div class="card"><h3 data-t="incoming"></h3><div id="incoming"></div></div>
      <button class="btn ghost" onclick="backToShop()" data-t="backShop"></button>
      <div style="height:8px"></div>
      <button class="btn line" onclick="logout()" data-t="logout"></button>
    </div>
  </main>

  <nav class="bottom" id="nav"><div class="in">
    <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="navHome"></span></button>
    <button data-go="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-t="navProducts"></span></button>
    <button data-go="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></svg><span data-t="navCart"></span><i class="badge" id="badge"></i></button>
    <button data-go="weekly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span data-t="navWeekly"></span></button>
    <button data-go="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="navAccount"></span></button>
  </div></nav>
</section>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="ok">✓</div>
    <h2 data-t="successTitle"></h2>
    <p class="muted" id="successBody" style="margin:6px 0 16px"></p>
    <button class="btn" onclick="closeModal()" data-t="ok"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const L={
ku:{demoBar:"دیمۆی پێشنیارکراوە لەلایەن Mhamad Tahir — بەرهەم، نرخ و ناوی فرۆشگاکان تەنها نموونەن",brand:"ڕاسان",brandShop:"پۆرتاڵی فرۆشگا و مارکێتەکان",brandFactory:"داشبۆردی کارگە",
loginTitle:"بەخێربێیت بۆ پۆرتاڵی داواکاری ڕاسان",loginSub:"مارکێت و فرۆشگاکان لێرەوە داواکاری هەفتانەیان دەنێرن — بەبێ تەلەفۆن و بەبێ هەڵە.",phone:"ژمارەی مۆبایل",code:"کۆدی فرۆشگا",loginBtn:"چوونەژوورەوە وەک فرۆشگا",loginFactory:"چوونەژوورەوە وەک بەڕێوەبەری کارگە",loginNote:"بۆ دیمۆ، تەنها یەکێک لە دوگمەکان دابگرە.",

document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
document.querySelectorAll('[data-tp]').forEach(el=>el.placeholder=t(el.dataset.tp));
document.querySelectorAll('[data-langs]').forEach(w=>{w.innerHTML=['ku','ar','en'].map(l=>`<button class="${l===S.lang?'on':''}" onclick="setLang('${l}')">${{ku:'کوردی',ar:'عربي',en:'EN'}[l]}</button>`).join('')});
document.title=S.lang==='en'?'Rasan — Retailer portal (demo)':S.lang==='ar'?'راسان — بوابة المحلات (تجريبي)':'ڕاسان — پۆرتاڵی فرۆشگاکان (دیمۆ)';
$('brandSub').textContent=S.role==='factory'?t('brandFactory'):t('brandShop');
$('whoName').textContent=S.role==='factory'?t('factoryName'):t('shopName');
document.querySelectorAll('.logo').forEach(l=>l.textContent=S.lang==='en'?'R':S.lang==='ar'?'ر':'ڕ');
}

function cartStats(){let c=0,tot=0,k=0;for(const[id,q]of Object.entries(S.cart)){if(q>0){k++;c+=q;tot+=q*PM[id].pr}}return{k,c,tot}}

function stepper(id,q,fn){return q>0?`<div class="step"><button onclick="${fn}('${id}',-1)">−</button><span>${num(q)}</span><button onclick="${fn}('${id}',1)">+</button></div>`:`<button class="addbtn" onclick="${fn}('${id}',1)">${t('add')}</button>`}
function prodInfo(p){return `${t('carton')} · ${num(p.pk)} ${t('pcs')}`}

function renderProducts(){
$('cats').innerHTML=[{id:'all',n:{ku:t('all'),ar:t('all'),en:t('all')},e:''}].concat(CATS).map(c=>`<button class="chip ${S.cat===c.id?'on':''}" onclick="S.cat='${c.id}';renderProducts()">${c.e?c.e+' ':''}${nm(c.n)}</button>`).join('');
const q=($('q').value||'').trim().toLowerCase();
const list=P.filter(p=>(S.cat==='all'||p.c===S.cat)&&(!q||Object.values(p.n).some(v=>v.toLowerCase().includes(q))||Object.values(CM[p.c].n).some(v=>v.toLowerCase().includes(q))));
$('plist').innerHTML=list.length?list.map(p=>{const c=CM[p.c];return `<div class="prod"><div class="tile" style="background:${c.bg}">${c.e}</div><div class="info"><b>${nm(p.n)}</b><div class="muted">${prodInfo(p)}</div><div class="price">${money(p.pr)}</div></div>${stepper(p.id,S.cart[p.id]||0,'addCart')}</div>`}).join(''):`<div class="empty">${t('noResults')}</div>`;
}

function addCart(id,d){const q=Math.max(0,(S.cart[id]||0)+d);if(q)S.cart[id]=q;else delete S.cart[id];if(d>0&&q===1)toast(t('toastAdded'));renderProducts();renderCart();renderBadge()}
function addWeekly(id,d){const q=Math.max(0,(S.weekly[id]||0)+d);if(q)S.weekly[id]=q;else delete S.weekly[id];renderWeekly()}

function renderBadge(){const{c}=cartStats();const b=$('badge');b.textContent=num(c);b.style.display=c?'grid':'none'}

function renderCart(){
const ids=Object.keys(S.cart);
if(!ids.length){$('cartItems').innerHTML=`<div class="empty"><div class="e">🛒</div>${t('cartEmpty')}<div style="height:12px"></div><button class="btn sm" style="margin:auto" onclick="go('products')">${t('goProducts')}</button></div>`;$('cartRest').style.display='none';return}
$('cartRest').style.display='block';
$('cartItems').innerHTML=ids.map(id=>{const p=PM[id],c=CM[p.c];return `<div class="line-item"><div class="tile" style="background:${c.bg};width:44px;height:44px;font-size:22px">${c.e}</div><div class="info"><b>${nm(p.n)}</b><span class="muted">${money(p.pr*S.cart[id])}</span></div>${stepper(id,S.cart[id],'addCart')}</div>`}).join('');
$('days').innerHTML=['sat','tue'].map((d,i)=>`<button class="day ${S.day===d?'on':''}" onclick="S.day='${d}';renderCart()"><b>${t(d)}</b><span class="muted">${dateTxt(nextOff(d))}</span></button>`).join('');
const s=cartStats();$('sCount').textContent=num(s.k);$('sCartons').textContent=num(s.c);$('sTotal').textContent=money(s.tot);
$('limitWarn').style.display=(S.balance+s.tot>S.limit)?'block':'none';
}
function nextOff(d){const target=d==='sat'?6:2;const now=new Date().getDay();let off=(target-now+7)%7;if(off===0)off=7;return off}

function renderWeekly(){
$('autoTog').classList.toggle('on',S.auto);$('autoInfo').style.display=S.auto?'inline-block':'none';
const ids=Object.keys(S.weekly);
$('weeklyItems').innerHTML=ids.length?ids.map(id=>{const p=PM[id],c=CM[p.c];return `<div class="line-item"><div class="tile" style="background:${c.bg};width:44px;height:44px;font-size:22px">${c.e}</div><div class="info"><b>${nm(p.n)}</b><span class="muted">${prodInfo(p)}</span></div>${stepper(id,S.weekly[id],'addWeekly')}</div>`}).join('')+`<div class="sum t"><span>${t('total')}</span><span>${money(ids.reduce((a,id)=>a+PM[id].pr*S.weekly[id],0))}</span></div>`:`<div class="empty">${t('weeklyEmpty')}</div>`;
}
function toggleAuto(){S.auto=!S.auto;renderWeekly()}
function loadWeekly(){if(!Object.keys(S.weekly).length){toast(t('weeklyEmpty'));return}S.cart={...S.weekly};toast(t('toastWeekly'));renderAll();go('cart')}
function saveWeekly(){if(!Object.keys(S.cart).length){toast(t('toastEmpty'));return}S.weekly={...S.cart};toast(t('toastSaved'));renderWeekly()}

function balHTML(){const pct=Math.min(100,Math.round(S.balance/S.limit*100));return `<div class="muted">${t('balance')}</div><div class="big">${money(S.balance)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="muted" style="margin-top:6px">${t('limit')}: ${money(S.limit)}</div>`}

function renderHome(){
const nd=S.sentThisWeek?S.orders[0].day:'sat';
$('nextDay').textContent=`${t(nd)} · ${dateTxt(nextOff(nd))}`;
if(S.sentThisWeek){const o=S.orders[0];$('weekStatus').innerHTML=`<div class="card" style="border-color:#bfe8d6"><div class="row"><b>✓ ${t('weekSent')}</b><span class="pill ${SPILL[o.st]}">${t('st_'+o.st)}</span></div><p class="muted">${o.id} · ${num(o.cartons)} ${t('cartonsW')} · ${money(o.total)}</p></div>`}
else $('weekStatus').innerHTML=`<div class="card" style="background:var(--warnbg);border-color:#f5d9b0"><b style="color:var(--warn)">${t('weekNotSent')}</b><p class="muted">${t('weekNotSentSub').replace('{d}',t('sat'))}</p></div>`;
$('balCard').innerHTML=balHTML();
}

function renderAccount(){
$('balCard2').innerHTML=balHTML();$('lastPay').textContent=money(545000);$('ordMonth').textContent=num(S.orders.length);
$('orderList').innerHTML=S.orders.map(o=>`<div class="order"><div class="row"><b>${o.id}</b><span class="pill ${SPILL[o.st]}">${t('st_'+o.st)}</span></div><div class="row muted"><span>${dateTxt(o.d)} · ${num(o.cartons)} ${t('cartonsW')}</span><span>${money(o.total)}</span></div><div style="margin-top:4px"><span class="pill ${o.paid?'p-ok':'p-bad'}">${o.paid?t('paid'):t('unpaid')}</span></div></div>`).join('');
}

function renderFactory(){
const tot={...S.base};S.incoming.forEach(o=>{if(o.items)for(const[id,q]of Object.entries(o.items))tot[id]=(tot[id]||0)+q});
const cartons=Object.values(tot).reduce((a,b)=>a+b,0);
const ordersN=AREAS.reduce((a,b)=>a+b.o,0)+S.incoming.filter(o=>o.items).length;
$('kpis').innerHTML=[[t('kOrders'),num(ordersN)],[t('kShops'),num(AREAS.reduce((a,b)=>a+b.s,0))],[t('kCartons'),num(cartons)],[t('kDebt'),money(48650000+S.balance-680000)]].map(k=>`<div class="kpi"><div class="muted">${k[0]}</div><div class="big" style="${k[1].length>10?'font-size:15px':''}">${k[1]}</div></div>`).join('');
const top=Object.entries(tot).sort((a,b)=>b[1]-a[1]);const max=top[0][1];
$('produce').innerHTML=top.map(([id,q])=>`<div class="hbar"><div class="row"><span>${CM[PM[id].c].e} ${nm(PM[id].n)}</span><b>${num(q)}</b></div><div class="bar"><i style="width:${Math.round(q/max*100)}%"></i></div></div>`).join('');
$('areas').innerHTML=AREAS.map(a=>`<div class="area"><span>📍 ${nm(a.n)}</span><span class="muted">${num(a.s)} ${t('shops')}</span><span class="n">${num(a.o)} ${t('ordersW')}</span></div>`).join('');
$('incoming').innerHTML=S.incoming.map((o,i)=>`<div class="order"><div class="row"><b>${o.id}</b><span class="pill ${SPILL[o.st]}">${t('st_'+o.st)}</span></div><div class="muted">${nm(o.shop)}</div><div class="row"><span class="muted">${num(o.cartons)} ${t('cartonsW')} · ${money(o.total)}</span>${o.st!=='done'?`<button class="btn sm ghost" onclick="advance(${i})">${t('next')}</button>`:''}</div></div>`).join('');
}
function advance(i){const o=S.incoming[i];o.st=STAT[Math.min(3,STAT.indexOf(o.st)+1)];if(o.mine){const m=S.orders.find(x=>x.id===o.id);if(m)m.st=o.st}toast(t('toastStatus'));renderAll()}

function submitOrder(){
const s=cartStats();if(!s.c){toast(t('toastEmpty'));return}
const id='RS-'+(1062+S.orders.length);
S.orders.unshift({id,d:0,day:S.day,cartons:s.c,total:s.tot,st:'received',paid:false});
S.incoming.unshift({id,mine:true,shop:{ku:L.ku.shopName,ar:L.ar.shopName,en:L.en.shopName},cartons:s.c,total:s.tot,st:'received',items:{...S.cart}});
S.balance+=s.tot;S.sentThisWeek=true;S.cart={};$('notes').value='';
$('successBody').textContent=t('successBody').replace('{n}',id).replace('{d}',t(S.day));
$('modal').classList.add('on');renderAll();
}
function closeModal(){$('modal').classList.remove('on');go('home')}

function go(v){S.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
document.querySelectorAll('nav.bottom [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
$('nav').style.display=S.role==='factory'?'none':'block';window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('nav.bottom [data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

function loginShop(){S.role='shop';$('login').style.display='none';$('app').style.display='block';$('topbar').classList.remove('fbanner');renderAll();go('home')}
function loginFactory(){S.role='factory';$('login').style.display='none';$('app').style.display='block';$('topbar').classList.add('fbanner');renderAll();go('factory')}
function backToShop(){loginShop()}
function logout(){$('app').style.display='none';$('login').style.display='block';window.scrollTo(0,0)}

let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}

function renderAll(){renderStatic();renderProducts();renderCart();renderWeekly();renderHome();renderAccount();renderFactory();renderBadge()}
setLang(S.lang);
</script>
</body>
</html>
